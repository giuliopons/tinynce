<!DOCTYPE html>

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex">

	##JQUERYINCLUDE##
	<script src="##root##src/template/comode.js?v=##VER##"></script>
	<script src="template/elenco.js"></script>
	<title>##TITLE##</title>
	<style>
		td.n,
		th.n {
			text-align: right !important;
		}

		th.mese {
			border-right: 1px solid #ccc;
		}
		td.ric,
		th.ric {
			border-left: 1px solid #ccc!important;
		}
		td.n.neg {
			color: #f00;
		}

		/* gruppo colonna Totale (report per mese) */
		td.total,
		th.total {
			border-left: 2px solid #999;
			font-weight: bold;
		}
		/* colonna Delta: leggera evidenziazione */
		td.delta { background: #fafafa; }
		td.nw {
			white-space: nowrap;
		}

		th.mese {
			text-align: center !important;
		}

		.report_print {
			display: none
		}

		/* celle cliccabili + popup di dettaglio */
		td.rcr-cell {
			cursor: pointer;
			text-decoration: underline dotted;
		}
		.rcr-popup {
			position: absolute;
			z-index: 9999;
			min-width: 8rem;
			max-width: 22rem;
			background: #fff;
			border: 1px solid #999;
			border-radius: 4px;
			box-shadow: 0 2px 8px rgba(0,0,0,.25);
			padding: .6rem 1.6rem .6rem .7rem;
			font-size: .85rem;
			line-height: 1.4;
			white-space: nowrap;
		}
		.rcr-pop-close {
			position: absolute;
			top: .1rem;
			right: .35rem;
			text-decoration: none;
			color: #999;
			font-size: 1.1rem;
			line-height: 1;
		}
		.rcr-pop-close:hover { color: #333; }
		.rcr-pop-row { padding: .05rem 0; }
		.rcr-pop-plus { color: #999; }

		/* matita di modifica nel popup + celle vuote cliccabili per inserimento */
		.rcr-edit {
			cursor: pointer;
			margin-left: .4rem;
			color: #888;
		}
		.rcr-edit:hover { color: #333; }
		td.rcr-empty { cursor: pointer; }
		td.rcr-empty:hover { background: #f3f7ff; }

		@media print {

			body,
			html {
				width: 100%;
				height: 100%;
				background: transparent
			}

			.panel2,
			a.btn,
			#mainmenucontainer,
			#mobiletoggle {
				display: none;
			}

			.corpo,
			.grigliacontainer {
				width: 100% !important
			}

			div.grigliacontainer {
				overflow-x: unset !important
			}

			.report_print {
				display: block;
				padding-bottom: 1rem
			}

			.rcr-popup { display: none !important; }

			td.rcr-cell { text-decoration: none; }
			.rcr-edit { display: none !important; }
			td.rcr-empty { cursor: default; background: transparent !important; }
		}


		@media only screen and (min-width: 768px) {
			/*  visualizzazione "tall" per recuperare righe */


			/* intestazione sticky: resta visibile scrollando in verticale dentro
			.grigliacontainer, e scorre normalmente con lo scroll orizzontale (solo
			"top" e' fissato, non "left") cosi' le colonne restano allineate.
			table.griglia ha di suo overflow:hidden (per l'angolo arrotondato), ma un
			overflow diverso da visible tra il th e il vero antenato scrollabile rompe
			position:sticky: lo neutralizziamo solo su #report e ricreiamo l'angolo
			arrotondato direttamente sulle celle d'angolo. */
			body.tall .griglia {
				overflow: visible;
			}
			body.tall .griglia tr:first-child th:first-child {
				border-top-left-radius: .5rem;
			}
			body.tall .griglia tr:first-child th:last-child {
				border-top-right-radius: .5rem;
			}
			/* sticky sull'intero thead (non sui singoli th): nel report "std" il thead
			contiene gia' due righe (mese + metriche) correttamente impilate dal
			layout naturale della tabella, comprese le celle rowspan=2 che le
			attraversano entrambe. Cosi' l'intero blocco si sposta come un'unita'
			sola, senza dover calcolare/indovinare l'altezza della prima riga per
			posizionare la seconda. */
			body.tall .griglia thead {
				position: sticky;
				top: 0;
				z-index: 2;
			}



			body.tall .titlecontainer {
				display:none
			}
			body.tall .panel2 {
				padding-top:0;
			}
			body.tall .filters .field {
				max-width:20%;
			}
			body.tall .filters .field select {
				max-width: 10vw;
			}

			/* la griglia puo' avere moltissime righe: la teniamo in un riquadro alto
			   quanto lo spazio residuo del viewport (sotto la barra filtri), con scroll
			   proprio, cosi' la sua scrollbar orizzontale resta sempre visibile in fondo
			   al riquadro invece di finire in fondo a una pagina lunghissima. */
			body.tall {
				height: 100vh;
				overflow: hidden;
				display: flex;
				flex-direction: column;
			}
			body.tall .corpo {
				flex: 1 1 auto;
				min-height: 0;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			body.tall .corpo .grigliacontainer {
				flex: 1 1 auto;
				min-height: 0;
				overflow: auto !important;
			}

			body.tall #download-report {
				position: absolute;
				top: 1rem;
				left: 2rem;
				z-index: 999;
			}
		}

	</style>


</head>

<body class="##classes## tall">

	<div class="panel2">
		<div class="titlecontainer">

			<h1 class='title'>##TITLE##</h1>

		</div>

		<div class="filters">

			##STARTFORM##
			##op##

			<div class="field">
				<label>{From}:</label>
				<span>##dal##</span>
			</div>
			<div class="field">
				<label>{To}:</label>
				<span>##al##</span>
			</div>


			<div class="field">
				<label>{Client}:</label>
				<span class="icon-filter">##cliente##</span>
			</div>

			<div class="field">
				<label>{Job}:</label>
				<span class="icon-filter">##job##</span>
			</div>

			<!-- <div class="field empty" style="flex:1 1 100%;"></div> -->

			<div class="field">
				<label>{Tipo di report}:</label>
				<span class="icon-filter">##gruppo##</span>
			</div>

			<div class="field">
				<label>{Status}:</label>
				<span class="icon-filter">##stato##</span>
			</div>

			<div class="field">
				<label>&nbsp;</label>
				<span><a href='#' id='submit' class='btn'>{Search}</a></span>
			</div>

			##ENDFORM##

		</div>
	</div>

	<div class="corpo">
		##corpo##
	</div>

</body>

</html>
