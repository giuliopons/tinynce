<!DOCTYPE html>

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex">

	##JQUERYINCLUDE##
	<script src="##root##src/template/comode.js?v=##VER##"></script>
	<script src="template/elenco.js"></script>
	<title>##TITLE##</title>
	<style>
		td.n,
		th.n {
			text-align: right !important;
		}

		td.pers,
		th.pers,th.mese {
			border-right: 1px solid #ccc;
		}
		td.nw {
			white-space: nowrap;
		}

		th.mese {
			text-align: center !important;
		}

		.report_print {
			display: none
		}

		/* celle cliccabili + popup di dettaglio */
		td.rcr-cell {
			cursor: pointer;
			text-decoration: underline dotted;
		}
		.rcr-popup {
			position: absolute;
			z-index: 9999;
			min-width: 8rem;
			max-width: 22rem;
			background: #fff;
			border: 1px solid #999;
			border-radius: 4px;
			box-shadow: 0 2px 8px rgba(0,0,0,.25);
			padding: .6rem 1.6rem .6rem .7rem;
			font-size: .85rem;
			line-height: 1.4;
			white-space: nowrap;
		}
		.rcr-pop-close {
			position: absolute;
			top: .1rem;
			right: .35rem;
			text-decoration: none;
			color: #999;
			font-size: 1.1rem;
			line-height: 1;
		}
		.rcr-pop-close:hover { color: #333; }
		.rcr-pop-row { padding: .05rem 0; }
		.rcr-pop-plus { color: #999; }

		.field .switch input[type=checkbox] {
			min-width: 4rem!important;
		}
		.field .switch label + span {
			display:inline;
			flex-shrink:1!important;
			margin-left:0;
		}
		.field span.colonne {
			display:flex;
			gap: 1rem;
		}

		@media print {

			body,
			html {
				width: 100%;
				height: 100%;
				background: transparent
			}

			.panel2,
			a.btn,
			#mainmenucontainer,
			#mobiletoggle {
				display: none;
			}

			.corpo,
			.grigliacontainer {
				width: 100% !important
			}

			div.grigliacontainer {
				overflow-x: unset !important
			}

			.report_print {
				display: block;
				padding-bottom: 1rem
			}

			.rcr-popup { display: none !important; }

			td.rcr-cell { text-decoration: none; }
		}
	</style>


</head>

<body>

	<div class="panel2">
		<div class="titlecontainer">

			<h1 class='title'>##TITLE##</h1>

		</div>

		<div class="filters">

			##STARTFORM##
			##op##

			<div class="field">
				<label>{From}:</label>
				<span>##dal##</span>
			</div>
			<div class="field">
				<label>{To}:</label>
				<span>##al##</span>
			</div>


			<div class="field">
				<label>{Client}:</label>
				<span class="icon-filter">##cliente##</span>
			</div>

			<div class="field">
				<label>{Job}:</label>
				<span class="icon-filter">##job##</span>
			</div>

			<div class="field empty" style="flex:1 1 100%;"></div>

			<div class="field">
				<label>{Tipo di report}:</label>
				<span class="icon-filter">##gruppo##</span>
			</div>

			<div class="field">
				<label>{Status}:</label>
				<span class="icon-filter">##stato##</span>
			</div>

			<div class="field">
				<label>{Columns}:<span data-rel="Scegli quale colonne inserire nel report" class="icon-help-circled"></span></label>
				<span class="colonne">##colonne##</span>
			</div>

			<div class="field">
				<label>&nbsp;</label>
				<span><a href='#' id='submit' class='btn'>{Search}</a></span>
			</div>

			##ENDFORM##

		</div>
	</div>

	<div class="corpo">
		##corpo##
	</div>

</body>

</html>
